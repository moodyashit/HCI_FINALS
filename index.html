<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Battle Arena</title>
  <link rel="stylesheet" href="retro.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="crt panel">

    <section id="titleScreen" class="screen title-screen">
      <h1 class="poke-logo">
        <span class="logo-yellow">POKÉMON</span>
        <span class="logo-sub">BATTLE ARENA</span>
      </h1>
      <button id="startButton" class="retro-btn blink">▶ PRESS START</button>
      <p class="footnote">
        <a href="stats.html" style="color:var(--accent-yellow)">VIEW BATTLE STATS</a>
      </p>
    </section>

    <section id="profileScreen" class="screen" hidden>
      <h2 class="section-title">YOUR PROFILE</h2>

      <div style="display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">
        <img id="githubAvatar" class="pixel-avatar round" alt="GitHub avatar">
        <div style="text-align:left;">
          <input id="githubInput" type="text" placeholder="GitHub username (optional)"
            style="font-family:'Press Start 2P',monospace;font-size:9px;padding:10px;border:2px solid #000;border-radius:6px;width:220px;">
          <br><br>
          <button id="githubConnectBtn" class="retro-btn small">CONNECT</button>
          <span id="githubStatus" style="font-size:8px;display:block;margin-top:8px;"></span>
        </div>
      </div>

      <h2 class="section-title">PICK YOUR TRAINER</h2>
      <div id="trainerGrid" class="trainer-grid"></div>

      <button id="profileContinueBtn" class="retro-btn" disabled>CONTINUE</button>
    </section>

    <section id="pokemonSelection" class="screen select-screen" hidden>
      <h2 class="section-title">CHOOSE <span id="pickCount">3</span> <span id="pickWho"></span>POKÉMON</h2>
      <div id="setupBars">
        <div class="mode-bar">
          <button class="retro-btn small mode-btn" data-size="1">1 V 1</button>
          <button class="retro-btn small mode-btn" data-size="2">2 V 2</button>
          <button class="retro-btn small mode-btn" data-size="3">3 V 3</button>
        </div>
        <div class="mode-bar" id="oppRow">
          <button class="retro-btn small opp-btn" data-mode="random">RANDOM FOE</button>
          <button class="retro-btn small opp-btn" data-mode="choose">CHOOSE FOE</button>
        </div>
        <div class="mode-bar">
          <button class="retro-btn small camp-btn" data-camp="single">SINGLE BATTLE</button>
          <button class="retro-btn small camp-btn" data-camp="campaign">GYM CAMPAIGN</button>
        </div>
      </div>
      <div class="pokemon-container" id="pokemonContainer"></div>
      <div class="team-bar">
        <p style="font-size:9px;margin:0 0 10px;">YOUR FIRST PICK LEADS THE BATTLE</p>
        <button id="teamBackBtn" class="retro-btn small" hidden>BACK</button>
        <button id="teamStartBtn" class="retro-btn" disabled>START BATTLE (0/3)</button>
      </div>
    </section>

  </div>

  <script src="index.js"></script>
</body>
</html>
