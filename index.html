<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Battle Arena</title>
  <link rel="stylesheet" href="retro.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="crt">
    <section id="titleScreen" class="screen title-screen">
      <h1 class="poke-logo">
        <span class="logo-yellow">POKÉMON</span>
        <span class="logo-sub">BATTLE ARENA</span>
      </h1>
      <button id="startButton" class="retro-btn blink">▶ PRESS START</button>
      <p class="footnote">A Fan-Made Battle Demo</p>
    </section>

    <section id="pokemonSelection" class="screen select-screen" hidden>
      <h2 class="section-title">CHOOSE YOUR POKÉMON</h2>
      <div class="pokemon-container">
        <button class="pokemon-card" data-name="Pikachu" data-type="electric">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/pikachu.gif" alt="Pikachu">
          <span>Pikachu</span>
        </button>
        <button class="pokemon-card" data-name="Bulbasaur" data-type="grass">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/bulbasaur.gif" alt="Bulbasaur">
          <span>Bulbasaur</span>
        </button>
        <button class="pokemon-card" data-name="Charmander" data-type="fire">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/charmander.gif" alt="Charmander">
          <span>Charmander</span>
        </button>
        <button class="pokemon-card" data-name="Squirtle" data-type="water">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/squirtle.gif" alt="Squirtle">
          <span>Squirtle</span>
        </button>
        <button class="pokemon-card" data-name="Blastoise" data-type="water">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/blastoise.gif" alt="Blastoise">
          <span>Blastoise</span>
        </button>
        <button class="pokemon-card" data-name="Charizard" data-type="fire">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/charizard.gif" alt="Charizard">
          <span>Charizard</span>
        </button>
        <button class="pokemon-card" data-name="Eevee" data-type="normal">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/eevee.gif" alt="Eevee">
          <span>Eevee</span>
        </button>
        <button class="pokemon-card" data-name="Jigglypuff" data-type="normal">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/jigglypuff.gif" alt="Jigglypuff">
          <span>Jigglypuff</span>
        </button>
        <button class="pokemon-card" data-name="Gengar" data-type="ghost">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/gengar.gif" alt="Gengar">
          <span>Gengar</span>
        </button>
        <button class="pokemon-card" data-name="Snorlax" data-type="normal">
          <img src="https://img.pokemondb.net/sprites/black-white/anim/normal/snorlax.gif" alt="Snorlax">
          <span>Snorlax</span>
        </button>
      </div>
    </section>
  </div>

  <script src="index.js"></script>
</body>
</html>
