<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Battle</title>
  <link rel="stylesheet" href="retro.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="trainerIntro" class="crt trainer-intro">
    <img id="trainerAvatar" class="pixel-avatar" style="width:96px;height:96px;margin:0 auto 20px;" alt="Trainer">
    <p id="trainerText" class="trainer-text">A trainer wants to battle!</p>
    <select id="difficulty" style="font-family:'Press Start 2P',monospace;font-size:10px;padding:10px;margin-bottom:20px;border:2px solid #000;border-radius:6px;">
      <option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option>
    </select><br>
    <button id="battleStartBtn" class="retro-btn">BATTLE!</button>
  </div>

  <div id="battleFrame" class="crt battle-frame" hidden>
    <div class="game">
      <div class="menu-wrap">
        <button id="menuBtn" class="menu-btn">MENU</button>
        <div id="menuDropdown" class="menu-dropdown" hidden>
          <button id="muteBtn">🔊 Sound: On</button>
          <button id="forfeitBtn">🏳 Forfeit Battle</button>
          <a href="stats.html">📊 View Stats</a>
          <a href="index.html">🏠 Main Menu</a>
        </div>
      </div>

      <div class="opponent">
        <div class="stats">
          <div class="top">
            <span id="oppName" class="name">Charizard</span>
            <span id="oppLevel" class="level">50</span>
          </div>
          <div class="hp-bar"><div id="oppHPBar" class="hp-fill"></div></div>
          <div id="oppHPText" class="hp-count">100/100</div>
          <div id="oppDots" class="dots"></div>
        </div>
        <div class="sprite-wrap"><img id="oppSprite" class="pokemon" src="" alt="Opponent sprite"></div>
      </div>

      <div class="player">
        <div class="sprite-wrap"><img id="playerSprite" class="pokemon" src="" alt="Your sprite"></div>
        <div class="stats">
          <div class="top">
            <div style="display:flex;align-items:center;gap:6px;">
              <img id="playerBadge" class="pixel-avatar" style="width:28px;height:28px;border-width:2px;" alt="You">
              <span id="playerName" class="name">Blastoise</span>
            </div>
            <span id="playerLevel" class="level">50</span>
          </div>
          <div class="hp-bar"><div id="playerHPBar" class="hp-fill"></div></div>
          <div id="playerHPText" class="hp-count">100/100</div>
          <div id="playerDots" class="dots"></div>
        </div>
      </div>
    </div>

    <div class="box">
      <div id="message" class="message">What will you do?</div>
      <div id="actions" class="actions"></div>
      <div id="switchPanel" class="actions" hidden></div>
      <button id="switchBtn" class="retro-btn small" style="margin-top:10px;">SWITCH POKÉMON</button>
      <button id="itemBtn" class="retro-btn small" style="margin:10px 0 0 10px;">ITEMS</button>
      <button id="restartButton" class="retro-btn" hidden>PLAY AGAIN</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
